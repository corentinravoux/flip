site_name: flip
site_description: Field-level inference of the growth rate from velocity and density fields
site_url: https://flip.readthedocs.io/
repo_url: https://github.com/corentinravoux/flip
repo_name: corentinravoux/flip

# The legacy Sphinx sources are kept in docs/ for reference but are not part of
# the MkDocs build. (gitignore-style patterns.)
exclude_docs: |
  *.rst
  conf.py
  _templates/
  _static/

theme:
  name: material
  logo: assets/flip_logo.webp
  favicon: assets/flip_logo.webp
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
  - tables

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            filters: ["!^_"]
            members_order: source
            heading_level: 2
            merge_init_into_class: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Getting started: getting-started.md
  - User guide:
      - Data vectors: data-vectors.md
      - Velocity estimators: velocity-estimators.md
      - Power spectra: power-spectra.md
      - Covariance models: covariance-models.md
      - Likelihoods: likelihoods.md
      - Fitting & forecasts: fitting.md
  - API reference:
      - Overview: api/index.md
      - data_vector: api/data_vector.md
      - power_spectra: api/power_spectra.md
      - covariance: api/covariance.md
      - Covariance models & emulators: api/covariance-models.md
      - utils: api/utils.md
