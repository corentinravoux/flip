; CosmoSIS pipeline: flip peculiar-velocity fit through firecrown.
;
; The flip likelihood is rebuilt from files (new process): the covariance
; flip_velocity_covariance.npz written by notebook/flip_velocity_firecrown.ipynb
; (CovMatrix.write) and the SACC data flip/data/data_velocity_sacc.fits.gz
; (firecrown_interface.write_sacc, distances as tags).
;
; Run from the directory holding flip_velocity_covariance.npz:
;   export FIRECROWN_DIR=$(python -c "import firecrown, os; print(os.path.dirname(os.path.dirname(firecrown.__file__)))")
;   export FLIP_DATA=$(python -c "import flip, os; print(os.path.join(flip.__flip_dir_path__, 'data'))")
;   cosmosis ${FLIP_DATA}/firecrown_velocity.ini
;
; Switch to the true-velocity fit with data_vector = DirectVel and the [flip]
; parameters fs8 and sigv only.

[runtime]
sampler = maxlike
verbosity = quiet

[maxlike]
method = Nelder-Mead
tolerance = 1e-6
maxiter = 10000
output_ini = flip_velocity_bestfit_values.ini

[test]
save_dir = flip_velocity_test
fatal_errors = T

[output]
filename = flip_velocity_maxlike.txt
format = text

[pipeline]
modules = firecrown_likelihood
values = ${FLIP_DATA}/firecrown_velocity_values.ini
likelihoods = firecrown
debug = F
timing = F

[firecrown_likelihood]
file = ${FIRECROWN_DIR}/firecrown/connector/cosmosis/likelihood.py
likelihood_source = flip.covariance.firecrown_interface
sampling_parameters_sections = cosmological_parameters flip
; build parameters, see flip.covariance.firecrown_interface.build_likelihood
covariance_file = flip_velocity_covariance
covariance_format = npz
sacc_file = ${FLIP_DATA}/data_velocity_sacc.fits.gz
data_vector = snia_vectors.VelFromSALTfit
velocity_estimator = full
h = 0.7
prefix = flip
ccl_creation_mode = pure_ccl_mode
mass_split = single
