# flip_terms generator configuration: Adams & Blake 2020.
# Regenerate with flip.covariance.analytical.symbolic.generate_flip_terms("flip_terms.yml").
# lmax follows Adams & Blake 2020; use gg lmax 6 and gv lmax 5 to generate lmax + 1.
wide_angle: false
additional_parameters:
- sig_g
multi_index_model: false
regularize_M_terms:
  gg: mpmath
  gv: mpmath
  vv: null
terms:
  gg:
    '0':
      F: exp(-k**2*mu**2*sig_g**2)
      lmax: 4
    '1':
      F: 2*mu**2*exp(-k**2*mu**2*sig_g**2)
      lmax: 4
    '2':
      F: mu**4*exp(-k**2*mu**2*sig_g**2)
      lmax: 4
  gv:
    '0':
      F: 100*mu*exp(-k**2*mu**2*sig_g**2/2)/k
      lmax: 3
    '1':
      F: 100*mu**3*exp(-k**2*mu**2*sig_g**2/2)/k
      lmax: 3
  vv:
    '0':
      F: 10000*mu**2/k**2
      lmax: 2
