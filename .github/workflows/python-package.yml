# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest fastparquet sympy
        python -m pip install git+https://github.com/cosmodesi/cosmoprimo
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Test with pytest
      run: |
        pytest

  minimal:
    # Sparse checkout + FLIP_MINIMAL: velocity covariance with numpy, scipy,
    # astropy and matplotlib only (pandas/pyarrow read the test data).
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: |
          flip/covariance/analytical/carreres23
          flip/covariance/analytical/adamsblake20
          flip/data
          test
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install minimal dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-minimal.txt pandas pyarrow pytest
    - name: Test minimal mode
      run: |
        pytest test/test_minimal_mode.py
