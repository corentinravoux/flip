# Read the Docs configuration file
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Hosting is kept on Read the Docs (https://flip.readthedocs.io/), but the
# documentation is *compiled with MkDocs* instead of Sphinx. The legacy Sphinx
# sources are preserved in docs/ (conf.py, *.rst) for reference; the live site
# is built from mkdocs.yml + the Markdown pages in docs/.
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

# Build the documentation with MkDocs (not Sphinx).
mkdocs:
  configuration: mkdocs.yml

# Dependencies required to build the MkDocs site.
python:
  install:
    - requirements: requirements-docs.txt
