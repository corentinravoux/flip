# flip_terms generator configuration: Adams & Blake 2017.
# Regenerate with flip.covariance.analytical.symbolic.generate_flip_terms("flip_terms.yml").
wide_angle: true
additional_parameters: []
multi_index_model: false
regularize_M_terms: null
terms:
  gg:
    '0':
      F: '1'
      lmax: 2
      l1max: 2
      l2max: 2
  gv:
    '0':
      F: 100*mu2/k
      lmax: 2
      l1max: 2
      l2max: 2
  vv:
    '0':
      F: 10000*mu1*mu2/k**2
      lmax: 2
      l1max: 2
      l2max: 2
